<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Demo</title>
</head>
<body>

<h1>Vind rijksmusea</h1>
<p>Voer een postcode in en krijg te zien welke rijksmusea dichtbij zijn.</p>

<form>
	<label for="postcode">Postcode</label>
	<input
		type="text"
		id="postcode"
		placeholder="1234AB"
		title="Postcode"
		maxlength="7"
		size="7"
		autofocus
		autocomplete="off"
		autocapitalize="on">
	<button id="zoek" type="submit">Zoek</button>
	<br>
	<button onclick="demo('1118AP')">Schipholtoren</button>
	<button onclick="demo('3512JE')">Domtoren</button>
	<button onclick="demo('9712GJ')">Martinitoren</button>
</form>

<div class="info"></div>
<ul id="results"></ul>

<script src=" https://cdn.jsdelivr.net/npm/js-geohash@1.0.0/geohash.min.js "></script>
<script>
	const results_el = document.querySelector('#results');

	document.querySelector('form').addEventListener('submit', function(event) {
		event.preventDefault();
		zoek();
	});

	const locaties = [
		{naam: 'Rijksmuseum Amsterdam', coords: [52.359969,4.885325]},
		{naam: 'Van Gogh Museum', coords: [52.358461,4.881278]},
		{naam: 'Het Scheepvaartmuseum', coords: [52.371389,4.914722]},
		{naam: 'Nationaal Museum Paleis Het Loo', coords: [52.234167,5.945833 ]},
		{naam: 'Nederlands Openluchtmuseum', coords: [52.009444,5.906389 ]},
		{naam: 'Koninklijk Kabinet van Schilderijen Mauritshuis', coords: [52.080278,4.314167 ]},
		{naam: 'Museum Meermanno', coords: [52.083611,4.316944 ]},
		{naam: 'Zuiderzeemuseum', coords: [52.703667,5.297222 ]},
		{naam: 'Rijksmuseum Twenthe', coords: [52.227778,6.896944 ]},
		{naam: 'Wereldmuseum Leiden', coords: [52.163056,4.4825 ]},
		{naam: 'Rijksmuseum van Oudheden', coords: [52.158333,4.485833 ]},
		{naam: 'Rijksmuseum Boerhaave', coords: [52.161389,4.488889 ]},
		{naam: 'Nationaal Natuurhistorisch Museum Naturalis', coords: [52.164722,4.475278 ]},
		{naam: 'Muiderslot', coords: [52.334231,5.071806 ]},
		{naam: 'Kröller-Müller Museum', coords: [52.095942,5.816925 ]},
		{naam: 'Slot Loevestein', coords: [51.816389,5.021389 ]},
		{naam: 'Museum Catharijneconvent', coords: [52.087222,5.124167 ]},
		{naam: 'Museum de Gevangenpoort', coords: [52.079667,4.310281]},
	]

	function haversine(lat1, lon1, lat2, lon2) {
		function deg2rad(degrees) {
			return degrees * (Math.PI / 180);
		}
		const R = 6371;
		const dLat = deg2rad(lat2 - lat1);
		const dLon = deg2rad(lon2 - lon1);

		const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
				Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
				Math.sin(dLon / 2) * Math.sin(dLon / 2);
		const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

		return c * R;
	}

	function results(inputLat,inputLon) {
		// Calculate distances
		locaties.forEach((loc) => {
			const [lat, lon] = loc.coords;
			loc.distance = haversine(inputLat, inputLon, lat, lon);
		});

		// Sort by distance
		locaties.sort((a, b) => a.distance - b.distance);

		// Show results
		results_el.innerHTML = '';
		locaties.forEach(loc => {
			distance_str = loc.distance < 1 ? '< 1' : loc.distance.toFixed(1);
			results_el.innerHTML += `<li>
				<b>${loc.naam}</b><br>${distance_str} km<br>
				<a href="http://www.openstreetmap.org/?mlat=${loc.coords[0]}&mlon=${loc.coords[1]}" target="_blank">Kaart</a> | <a href="https://www.openstreetmap.org/directions?route=${inputLat}%2C${inputLon}%3B${loc.coords[0]}%2C${loc.coords[1]}" target="_blank">Route</a>
				</li>`;
		});
	}

	let bitmapBits = null;
	let coordsBytes = null;

	const isGzipSupported = typeof DecompressionStream === "function";

	async function decompressGzip(arrayBuffer) {
		const ds = new DecompressionStream("gzip");
		const decompressedStream = new Response(
			new Blob([arrayBuffer]).stream().pipeThrough(ds)
		);
		return await decompressedStream.arrayBuffer();
	}

	async function fetchBinary(url, isGzip) {
		const response = await fetch(url);
		const buffer = await response.arrayBuffer();
		const data = isGzip ? await decompressGzip(buffer) : buffer;
		return new Uint8Array(data);
	}

	async function fetchBinaries() {
		let bitmapBytes = null;

		if (isGzipSupported) {
			[bitmapBytes, coordsBytes] = await Promise.all([
				fetchBinary('src/bitmap.bin.gz', true),
				fetchBinary('src/coords.bin.gz', true)
			]);
		}
		else {
			[bitmapBytes, coordsBytes] = await Promise.all([
				fetchBinary('src/bitmap.bin', false),
				fetchBinary('src/coords.bin', false)
			]);
		}

		bitmapBits = [];
		for (const byte of bitmapBytes) {
			for (let bit = 7; bit >= 0; bit--) {
				bitmapBits.push((byte >> bit) & 1);
			}
		}
	}

	let offset1000s_validcount = 0; // 1000AA - 1999ZZ
	let offset2000s_validcount = 0; // 2000AA - 2999ZZ
	let offset3000s_validcount = 0;
	let offset4000s_validcount = 0;
	let offset5000s_validcount = 0;
	let offset6000s_validcount = 0;
	let offset7000s_validcount = 0;
	let offset8000s_validcount = 0;

	window.onload = async function() {
		await fetchBinaries();

		const start = performance.now();
		for (let index = 0; index < 676000; index++) {
			if (bitmapBits[index + 0*676000]) offset1000s_validcount++;
			if (bitmapBits[index + 1*676000]) offset2000s_validcount++;
			if (bitmapBits[index + 2*676000]) offset3000s_validcount++;
			if (bitmapBits[index + 3*676000]) offset4000s_validcount++;
			if (bitmapBits[index + 4*676000]) offset5000s_validcount++;
			if (bitmapBits[index + 5*676000]) offset6000s_validcount++;
			if (bitmapBits[index + 6*676000]) offset7000s_validcount++;
			if (bitmapBits[index + 7*676000]) offset8000s_validcount++;
		}
		document.querySelector('.info').innerHTML += `Counting valid postcodes took ${performance.now() - start} ms.`;
	};

	function zoek() {
		results_el.innerHTML = '';
		const info_el = document.querySelector('.info');
		const input_el = document.querySelector('input#postcode');
		info_el.innerHTML = '';

		const value = input_el.value.trim();
		if (value.length === 0) {
			return;
		}

		const postcode_regex = new RegExp("^(\\d{4})\\s?([A-Z]{2})$", "gi"); // https://regex101.com/r/2vSYX9/1
		var match = postcode_regex.exec(value);
		if (!match) {
			info_el.innerHTML = 'Invalid postcode format.';
			return;
		}
		const input_postcode = match[1] + match[2].toUpperCase();
		input_el.value = input_postcode;
		info_el.innerHTML = `postcode: <a href="https://www.openstreetmap.org/search?query=${input_postcode}" target="_blank">${input_postcode}</a>`;

		// TODO: accommodate PC4 input

		function postcodeToIndex(postcode) {
			const digits = parseInt(postcode.toUpperCase().slice(0, 4), 10);
			const firstLetter = postcode[4];
			const secondLetter = postcode[5];

			function letterToIndex(char) {
				return char.charCodeAt(0) - 'A'.charCodeAt(0);
			}
			const firstLetterIndex = letterToIndex(firstLetter);
			const secondLetterIndex = letterToIndex(secondLetter);

			const lettersIndex = firstLetterIndex * 26 + secondLetterIndex;
			const index = (digits - 1000) * 676 + lettersIndex;

			return index;
		}

		function postcodeToGeohash(postcode) {
			let coords_index = 0;

			let offset_validsum = 0;
			let offset_index = 0;
			if (postcode.startsWith('1')) {
				offset_validsum = 0;
				offset_index = 0*676000;
			}
			if (postcode.startsWith('2')) {
				offset_validsum = offset1000s_validcount;
				offset_index = 1*676000;
			}
			if (postcode.startsWith('3')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount;
				offset_index = 2*676000;
			}
			if (postcode.startsWith('4')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount + offset3000s_validcount
				offset_index = 3*676000;
			}
			if (postcode.startsWith('5')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount + offset3000s_validcount + offset4000s_validcount
				offset_index = 4*676000;
			}
			if (postcode.startsWith('6')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount + offset3000s_validcount + offset4000s_validcount + offset5000s_validcount
				offset_index = 5*676000;
			}
			if (postcode.startsWith('7')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount + offset3000s_validcount + offset4000s_validcount + offset5000s_validcount + offset6000s_validcount
				offset_index = 6*676000;
			}
			if (postcode.startsWith('8')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount + offset3000s_validcount + offset4000s_validcount + offset5000s_validcount + offset6000s_validcount + offset7000s_validcount
				offset_index = 7*676000;
			}
			if (postcode.startsWith('9')) {
				offset_validsum = offset1000s_validcount + offset2000s_validcount + offset3000s_validcount + offset4000s_validcount + offset5000s_validcount + offset6000s_validcount + offset7000s_validcount + offset8000s_validcount
				offset_index = 8*676000;
			}

			const index = postcodeToIndex(postcode);

			// Count postcodes with coordinate in current thousand block
			for (let i = offset_index; i < index; i++) {
				if (bitmapBits[i] === 1) coords_index++;
			}

			const bit = bitmapBits[index];
			if (!bit) {
				return null;
			}
			console.log({bitmap_index: index, postcode: postcode, value: bit, coords_index: bit ? (offset_validsum + coords_index) : null});
			const char0 = coordsBytes[(offset_validsum + coords_index)*4 + 0]
			const char1 = coordsBytes[(offset_validsum + coords_index)*4 + 1]
			const char2 = coordsBytes[(offset_validsum + coords_index)*4 + 2]
			const char3 = coordsBytes[(offset_validsum + coords_index)*4 + 3]
			return 'u1' + String.fromCharCode(char0, char1, char2, char3);
		}

		const start = performance.now();
		const gh = postcodeToGeohash(input_postcode);
		const lookup_ms = performance.now() - start;

		if (gh === null) {
			info_el.innerHTML += `❓<br>
				geohash: unavailable<br>
				lat, lon: unavailable<br>
			`;
			return;
		}

		const [lat, lon] = geohash.decode(gh);
		results(lat, lon);
		info_el.innerHTML += `✔️<br>
			geohash: <a href="https://geohash.jorren.nl/#${gh}" target="_blank">${gh}</a><br>
			lat, lon: <a href="http://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}" target="_blank">${lat}, ${lon}</a>
			<br>
			lookup time: ${lookup_ms} ms
		`;
	}

	function demo(postcode) {
		document.querySelector('input#postcode').value = postcode;
		document.querySelector('button#zoek').click();
	}

</script>

<style>
	li {
		margin-bottom: 1rem;
	}
</style>

</body>
</html>
